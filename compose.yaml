services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.42.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      temporal:
        condition: service_healthy

  migrate:
    build: .
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blotato
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: npm run dev:api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blotato
      TEMPORAL_ADDRESS: temporal:7233
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    restart: on-failure

  worker:
    build: .
    command: npm run dev:worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blotato
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
